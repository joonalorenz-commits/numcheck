# Render Blueprint: dashboard.render.com -> New -> Blueprint -> this repo.
# Free plan sleeps after 15 min without requests; the first call then takes ~1 minute.
services:
  - type: web
    name: numcheck-mcp
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Public by design: OpenAI checks it at /.well-known/openai-apps-challenge
      - key: OPENAI_APPS_CHALLENGE
        value: AZepwrLIgP4EDXpqgdCrR6z3hiTt8yBi7kEAAMCNvNE
