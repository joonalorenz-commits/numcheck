# Keeps the hosted MCP server (Render free tier) awake while the
# OpenAI and Claude directory reviews are running. Render puts a free
# service to sleep after 15 minutes without traffic, and the first
# request after that takes about 12 seconds.
# Stops by itself after STOP_AFTER. Delete this file when the reviews are done.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

env:
  URL: https://numcheck-mcp.onrender.com/health
  STOP_AFTER: "2026-12-07"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          if [ "$(date -u +%F)" \> "$STOP_AFTER" ]; then
            echo "Past $STOP_AFTER, nothing to do."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" "$URL"
