# Fly.io alternative: fly launch --copy-config --no-deploy, then fly deploy
app = "numcheck-mcp"
primary_region = "fra"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "60s"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
